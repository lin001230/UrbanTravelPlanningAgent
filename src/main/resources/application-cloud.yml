spring:
  datasource:
    # MySQL is external to this container; use an address reachable from cloud hosting.
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:urban_travel_planning_agent}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&connectTimeout=10000&socketTimeout=30000
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  sql:
    init:
      # Create the two tables with schema.sql before deploying, not on each startup.
      mode: never
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      agent:
        base-url: ${DASHSCOPE_BASE_URL}
      chat:
        options:
          model: qwen3.7-flash
          multi-model: true
    mcp:
      client:
        stdio:
          connections:
            amap-mcp-server:
              command: node
              args:
                - /opt/amap/node_modules/@amap/amap-maps-mcp-server/build/index.js
              env:
                AMAP_MAPS_API_KEY: ${AMAP_MAPS_API_KEY}

search-api:
  api-key: ${SEARCH_API_KEY}
