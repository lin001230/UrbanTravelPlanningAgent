spring:
  datasource:
    # MySQL is external to this container; use an address reachable from cloud hosting.
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:urban_travel_planning_agent}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&connectTimeout=10000&socketTimeout=30000&tcpKeepAlive=true
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    hikari:
      # 云端 MySQL 会先关掉空闲连接。存活时间必须短于服务端 wait_timeout，默认 30 分钟会拿到已关闭的连接。
      max-lifetime: 50000
      keepalive-time: 30000
      idle-timeout: 30000
      minimum-idle: 1
      maximum-pool-size: 5
  sql:
    init:
      # Initialize the database with schema.sql manually, not on each startup.
      mode: never
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      agent:
        base-url: ${DASHSCOPE_BASE_URL}
      chat:
        options:
          model: qwen3.8-flash
          multi-model: true
      # 向量化不用聊天模型。和 KnowledgeEmbedCommand 保持 text-embedding-v4、1024 维。
      embedding:
        options:
          model: text-embedding-v4
          dimensions: 1024
    mcp:
      client:
        sse:
          connections:
            tencent-map:
              url: https://mcp.map.qq.com
              sse-endpoint: /sse?key=${TENCENT_MAP_API_KEY}

deepseek-search-api:
  api-key: ${DEEPSEEK_SEARCH_API_KEY}

app:
  jwt:
    # Optional at startup. Set JWT_SECRET in the cloud console before serving real users.
    secret: ${JWT_SECRET:urban-travel-planning-agent-secret}
