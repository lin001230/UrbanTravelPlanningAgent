spring:
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      agent:
        base-url: ${DASHSCOPE_BASE_URL}
      chat:
        options:
          model: qwen3.8-flash
          multi-model: true
      # 向量化不用聊天模型。和 KnowledgeEmbedCommand 保持 text-embedding-v4、1024 维。
      embedding:
        options:
          model: text-embedding-v4
          dimensions: 1024

    mcp:
      client:
        sse:
          connections:
            tencent-map:
              url: https://mcp.map.qq.com
              sse-endpoint: /sse?key=${TENCENT_MAP_API_KEY}


# DeepSeek 网页搜索：https://api.deepseek.com/v1/tools/search
deepseek-search-api:
  api-key: ${DEEPSEEK_SEARCH_API_KEY}