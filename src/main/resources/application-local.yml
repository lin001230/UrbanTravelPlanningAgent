spring:
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      agent:
        base-url: ${DASHSCOPE_BASE_URL}
      chat:
        options:
          model: qwen3.8-flash
          multi-model: true
      # 向量化不用聊天模型。和 KnowledgeEmbedCommand 保持 text-embedding-v4、1024 维。
      embedding:
        options:
          model: text-embedding-v4
          dimensions: 1024

    mcp:
      client:
        streamable-http:
          connections:
            tencent-map:
              url: https://mcp.map.qq.com
              endpoint: /mcp?key=${TENCENT_MAP_API_KEY}&format=0


# DeepSeek 网页搜索：https://api.deepseek.com/v1/tools/search
deepseek-search-api:
  api-key: ${DEEPSEEK_SEARCH_API_KEY}

# 公交路线工具直接请求腾讯 WebService，以便拿到 MCP 摘要里丢掉的途经站。
tencent-map:
  api-key: ${TENCENT_MAP_API_KEY}