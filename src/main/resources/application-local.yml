spring:
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      agent:
        base-url: ${DASHSCOPE_BASE_URL}
      chat:
        options:
          model: qwen3.7-flash
          multi-model: true

    mcp:
      client:
        stdio:
          connections:
            amap-mcp-server:
              command: npx.cmd
              args:
                - "-y"
                - "@amap/amap-maps-mcp-server"
              env:
                AMAP_MAPS_API_KEY: ${AMAP_MAPS_API_KEY}


# SearchApi.io 联网搜索：注册 https://www.searchapi.io/ 后在控制台获取 API Key 并替换
search-api:
  api-key: ${SEARCH_API_KEY}
