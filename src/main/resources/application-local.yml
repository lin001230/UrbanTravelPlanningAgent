spring:
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      agent:
        base-url: ${DASHSCOPE_BASE_URL}
      chat:
        options:
          model: qwen3.8-flash
          multi-model: true
      # 向量化不用聊天模型。和 KnowledgeEmbedCommand 保持 text-embedding-v4、1024 维。
      embedding:
        options:
          model: text-embedding-v4
          dimensions: 1024

    mcp:
      client:
        stdio:
          connections:
            amap-mcp-server:
              command: npx.cmd
              args:
                - "-y"
                - "@amap/amap-maps-mcp-server"
              env:
                AMAP_MAPS_API_KEY: ${AMAP_MAPS_API_KEY}


# DeepSeek 网页搜索：https://api.deepseek.com/v1/tools/search
deepseek-search-api:
  api-key: ${DEEPSEEK_SEARCH_API_KEY}