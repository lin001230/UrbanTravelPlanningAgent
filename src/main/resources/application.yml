spring:
  application:
    name: urban-travel-planning-agent
  profiles:
    active: local

  datasource:
    url: jdbc:mysql://localhost:3306/urban_travel_planning_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8888
  servlet:
    context-path: /api

app:
  jwt:
    secret: ${JWT_SECRET:urban-travel-planning-agent-secret}
    expire-hours: 2

#logging:
#  level:
#    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: debug

# springdoc-openapi
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: cn.szu.urbantravelplanningagent.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
